name: Daily FAQ, Knowledge and FAISS Update

on:
  schedule:
    - cron: '0 18 * * *'  # 毎日03:00 JST（UTC 18:00）
  workflow_dispatch:

concurrency:
  group: faqbot-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: 📦 リポジトリをチェックアウト
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🐍 Python をセットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 🔧 pip を更新
        run: |
          python -m pip install --upgrade pip

      - name: 🔧 必要なパッケージをインストール
        run: |
          pip install -r requirements.txt

      - name: 🔐 credentials.json を書き出し
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json

      - name: 📚 Knowledge を更新
        run: |
          python scripts/generate_knowledge.py

      - name: 🧠 FAQ・Embedding・FAISS を更新
        run: |
          python update_faq_and_rebuild.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: 💾 更新されたデータをコミット・プッシュ
        shell: bash
        run: |
          set -e

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            data/knowledge.json \
            data/faq.json \
            data/vector_data.npy \
            data/index.faiss

          if git diff --cached --quiet; then
            echo "✅ 更新されたデータはありません。"
            exit 0
          fi

          git commit -m "🔄 Daily auto-update FAQ, Knowledge and FAISS index"

          for attempt in 1 2 3
          do
            echo "🔄 最新 main を取り込みます (${attempt}/3)..."
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "✅ push が完了しました。"
              exit 0
            fi

            echo "⚠️ push が競合しました。再試行します (${attempt}/3)..."
            sleep 5
          done

          echo "❌ 3回試行しましたが push に失敗しました。"
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
